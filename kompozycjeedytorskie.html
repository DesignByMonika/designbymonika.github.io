<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kompozycje edytorskie | Portfolio Monika</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Michroma&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="project-background slider-has-header">

    <div id="scroll-progress"></div>
    <div id="cursor"></div>
    <div id="cursor-ring"></div>

    <nav>
        <span class="logo-portfolio"><a href="index.html">Portfolio</a></span>
        <div class="nav-links">
            <a href="index.html#grafika-projektowa">Powrót</a>
        </div>
    </nav>

    <header class="page-header">
        <h1>Projektowanie graficzne</h1>
        <p>Kompozycje edytorskie</p>
    </header>

    <main class="masonry-container" id="gallery-container">
        <div class="galeria-item"
             data-full="img/projektowanie_graficzne/kompozycjeedytorskie/kompozycjeedytorskie_1.jpg"
             data-title="Peter Jackson"
             data-desc="Ulotka/Broszura">
            <img src="img/projektowanie_graficzne/kompozycjeedytorskie/kompozycjeedytorskie_1.jpg" loading="lazy" alt="Peter Jackson">
        </div>
        <div class="galeria-item"
             data-full="img/projektowanie_graficzne/kompozycjeedytorskie/kompozycjeedytorskie_2.jpg"
             data-title="TOOL"
             data-desc="Projekt płyty">
            <img src="img/projektowanie_graficzne/kompozycjeedytorskie/kompozycjeedytorskie_2.jpg" loading="lazy" alt="TOOL">
        </div>
    </main>

    <div id="slider-modal">
        <nav class="lightbox-nav">
            <span class="logo-portfolio"><a href="index.html">Portfolio</a></span>
            <div class="nav-links">
                <a href="javascript:void(0);" class="close-lightbox">Powrót | Kompozycje edytorskie</a>
            </div>
        </nav>
        <div class="lightbox-header">
            <h1>Projektowanie graficzne</h1>
            <p>Kompozycje edytorskie</p>
        </div>
        <div class="lightbox-caption" id="slider-caption"></div>
        <button class="lb-nav" id="prev-btn">&#10094;</button>
        <div class="slider-main">
            <div class="slider-content">
                <img src="" id="slider-img" alt="Powiększony projekt">
            </div>
            <div class="slider-thumbs" id="slider-thumbs"></div>
        </div>
        <button class="lb-nav" id="next-btn">&#10095;</button>
    </div>

<footer>
  <div class="footer-inner">
    <div class="footer-copy">&copy; 2026 &nbsp;<span> designbymonika.github.io </span> &nbsp;·&nbsp;monikadesigndev@intmail.pl</div>
    <div class="footer-mark">Creative Technologist</div>
    <div class="footer-meta">
      <span class="footer-tag">Design</span>
      <span class="footer-tag">Frontend</span>
      <span class="footer-tag">3D</span>
    </div>
  </div>
</footer>

    <script>
        /* ══ KURSOR — kółko powiększające się na hover (jak na stronie głównej) ══ */
        const cursor     = document.getElementById('cursor');
        const cursorRing = document.getElementById('cursor-ring');
        let mx = 0, my = 0, rx = 0, ry = 0;

        if (cursor) {
            document.addEventListener('mousemove', e => {
                mx = e.clientX; my = e.clientY;
                cursor.style.left = mx + 'px';
                cursor.style.top  = my + 'px';
            });

            (function animCursor() {
                rx += (mx - rx) * 0.12;
                ry += (my - ry) * 0.12;
                if (cursorRing) {
                    cursorRing.style.left = rx + 'px';
                    cursorRing.style.top  = ry + 'px';
                }
                requestAnimationFrame(animCursor);
            })();

            document.querySelectorAll('a, button, .galeria-item, .nav-btn, .close-slider, .close-lightbox').forEach(el => {
                el.addEventListener('mouseenter', () => cursor.classList.add('expand'));
                el.addEventListener('mouseleave', () => cursor.classList.remove('expand'));
            });
        }

        /* ══ SCROLL PROGRESS ══ */
        const scrollBar = document.getElementById('scroll-progress');
        window.addEventListener('scroll', () => {
            if (scrollBar) {
                const pct = window.scrollY / (document.body.scrollHeight - window.innerHeight) * 100;
                scrollBar.style.width = pct + '%';
            }
        });

        /* ══ SLIDER / LIGHTBOX ══ */
        const modal = document.getElementById('slider-modal');
        const sliderImg = document.getElementById('slider-img');
        const sliderThumbs = document.getElementById('slider-thumbs');
        const sliderCaption = document.getElementById('slider-caption');
        const closeBtn = document.querySelector('.close-lightbox');
        let currentIndex = 0;
        let images = [];
        let titles = [];
        let descs = [];

        window.onload = () => {
            const items = document.querySelectorAll('.galeria-item');
            images = Array.from(items).map(item => item.getAttribute('data-full'));
            titles = Array.from(items).map(item => item.getAttribute('data-title') || '');
            descs  = Array.from(items).map(item => item.getAttribute('data-desc') || '');

            buildThumbs();

            items.forEach((item, index) => {
                item.onclick = () => {
                    currentIndex = index;
                    showImage();
                    modal.style.display = 'flex';
                    document.body.style.overflow = 'hidden';
                };
            });
        };

        function buildThumbs() {
            if (!sliderThumbs) return;
            sliderThumbs.innerHTML = '';
            images.forEach((src, i) => {
                const thumb = document.createElement('div');
                thumb.className = 'slider-thumb';
                thumb.innerHTML = `<img src="${src}" alt="Miniatura ${i + 1}">`;
                thumb.onclick = () => {
                    currentIndex = i;
                    showImage();
                };
                sliderThumbs.appendChild(thumb);
            });
        }

        function showImage() { 
            if (images[currentIndex]) {
                sliderImg.src = images[currentIndex]; 
            }
            if (sliderCaption) {
                const title = titles[currentIndex] || '';
                const desc  = descs[currentIndex] || '';
                sliderCaption.innerHTML = title
                    ? `<span class="lb-caption-title">${title}</span>${desc ? `<span class="lb-caption-desc">${desc}</span>` : ''}`
                    : '';
            }
            if (sliderThumbs) {
                sliderThumbs.querySelectorAll('.slider-thumb').forEach((t, i) => {
                    t.classList.toggle('active', i === currentIndex);
                });
            }
        }

        function moveNext() { 
            currentIndex = (currentIndex + 1) % images.length; 
            showImage(); 
        }

        function movePrev() { 
            currentIndex = (currentIndex - 1 + images.length) % images.length; 
            showImage(); 
        }

        document.getElementById('next-btn').onclick = (e) => { e.stopPropagation(); moveNext(); };
        document.getElementById('prev-btn').onclick = (e) => { e.stopPropagation(); movePrev(); };
        
        closeBtn.onclick = () => { 
            modal.style.display = 'none'; 
            document.body.style.overflow = 'auto'; 
        };

        modal.onclick = (e) => { if(e.target === modal) closeBtn.onclick(); };

        document.addEventListener('keydown', (e) => {
            if (modal.style.display === 'flex') {
                if (e.key === "ArrowRight") moveNext();
                if (e.key === "ArrowLeft") movePrev();
                if (e.key === "Escape") closeBtn.onclick();
            }
        });
    </script>
</body>
</html>
